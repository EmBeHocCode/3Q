#--------------------------------------

# 默认27017
port=27017

#允许远程IP连接
bind_ip=127.0.0.1

# 数据库文件位置
dbpath=/usr/local/mongodb/data

# 是否以守护进程方式运行
fork=true

# 以追加方式写入日志
logappend=true

# 日志文件位置
logpath=/usr/local/mongodb/logs/mongodb.log

journal=true

# 启用验证
auth = true

#------------------------------------------